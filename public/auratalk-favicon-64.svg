<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="AuraTalk favicon">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="56%">
      <stop offset="0%" stop-color="#0b0402"/>
      <stop offset="42%" stop-color="#160300"/>
      <stop offset="66%" stop-color="#ff2a00" stop-opacity="0.82"/>
      <stop offset="83%" stop-color="#ff3b00" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="innerDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#070100"/>
      <stop offset="100%" stop-color="#210300"/>
    </radialGradient>

    <linearGradient id="ringFill" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb236"/>
      <stop offset="24%" stop-color="#ff5a00"/>
      <stop offset="52%" stop-color="#ff2600"/>
      <stop offset="78%" stop-color="#ff4b00"/>
      <stop offset="100%" stop-color="#ffd15a"/>
    </linearGradient>

    <filter id="outerGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5.4" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix"
        values="1 0 0 0 1
                0 0.22 0 0 0.16
                0 0 0.04 0 0
                0 0 0 1 0" result="orangeGlow"/>
      <feMerge>
        <feMergeNode in="orangeGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hotEdge" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" fill="#000000"/>
  <circle cx="32" cy="32" r="31.6" fill="url(#bgGlow)"/>

  <circle cx="32" cy="32" r="21.7"
          fill="none"
          stroke="#ff3b00"
          stroke-width="6.3"
          stroke-opacity="0.88"
          filter="url(#outerGlow)"/>

  <circle cx="32" cy="32" r="21.7"
          fill="none"
          stroke="url(#ringFill)"
          stroke-width="4.7"
          filter="url(#hotEdge)"/>

  <circle cx="32" cy="32" r="17.9" fill="url(#innerDark)"/>

  <circle cx="32" cy="32" r="24.7"
          fill="none"
          stroke="#ffd36a"
          stroke-width="1.1"
          stroke-opacity="0.95"/>

  <circle cx="32" cy="32" r="19.1"
          fill="none"
          stroke="#ff7a17"
          stroke-width="0.7"
          stroke-opacity="0.7"/>
</svg>
